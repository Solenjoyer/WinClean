name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.rid }}
    needs: ci
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve the version from the tag
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $numeric = ($version -split '-')[0]
          "version=$version" >> $env:GITHUB_OUTPUT
          "numeric=$numeric" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($version -like '*-*') { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Check that the tag is on main and the changelog has a section
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The tag is not on main.' }
          $version = '${{ steps.version.outputs.version }}'
          $changelog = Get-Content CHANGELOG.md -Raw
          if ($changelog -notmatch "(?m)^## \[$([regex]::Escape($version))\]") {
            throw "CHANGELOG.md has no section for $version."
          }

      - name: Restore
        run: dotnet restore WinClean.slnx --locked-mode

      - name: Publish
        run: >
          dotnet publish src/WinClean/WinClean.csproj -c Release -r ${{ matrix.rid }}
          -p:Version=${{ steps.version.outputs.version }} -p:RestoreLockedMode=true
          -o artifacts/publish/${{ matrix.rid }}

      - name: Sign the executable
        if: vars.HAS_CERT == 'true'
        shell: pwsh
        env:
          CODE_SIGNING_PFX: ${{ secrets.CODE_SIGNING_PFX }}
          CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}
        run: pwsh eng/sign.ps1 artifacts/publish/${{ matrix.rid }}/WinClean.exe

      - name: Package
        shell: pwsh
        run: >
          pwsh eng/build-release.ps1 -Rid ${{ matrix.rid }} -Version ${{ steps.version.outputs.version }}

      - name: Sign the installer
        if: vars.HAS_CERT == 'true'
        shell: pwsh
        env:
          CODE_SIGNING_PFX: ${{ secrets.CODE_SIGNING_PFX }}
          CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}
        run: pwsh eng/sign.ps1 (Get-ChildItem artifacts/release/*-setup.exe).FullName

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error

  publish:
    name: Draft the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Release notes from the changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            /^## \[/ { if (on) exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Software bill of materials
        shell: bash
        run: |
          dotnet tool install --global CycloneDX
          dotnet CycloneDX src/WinClean/WinClean.csproj -o dist -fn "WinClean-${GITHUB_REF_NAME#v}-sbom.cdx.json" --json

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "WinClean $version" --notes-file notes.md $prerelease dist/*
