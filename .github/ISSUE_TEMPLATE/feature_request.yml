name: Feature request
description: Something WinClean should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution. What question should WinClean answer, or what task should it make easier?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: A description of the behaviour. Mock-ups are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
