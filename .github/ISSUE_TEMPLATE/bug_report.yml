name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: WinClean version
      description: Shown on the Settings page, under About.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      description: Shown on the Health page.
      placeholder: Windows 11 Pro 24H2, build 26100.4061
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How WinClean was running
      options:
        - Installed, standard user
        - Installed, as administrator
        - Portable, standard user
        - Portable, as administrator
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: Processor and graphics adapter, if relevant.
      placeholder: Intel Core Ultra 7 155H, NVIDIA RTX 4060 Laptop
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: The relevant lines from the log folder (Settings, Open log folder). Remove anything you consider private.
      render: text
